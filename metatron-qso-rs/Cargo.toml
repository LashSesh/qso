[package]
name = "metatron-qso-rs"
description = "Validated quantum simulation in pure Rust: statevector and density-matrix simulators, variational algorithms with adjoint gradients, and continuous-time quantum walks on arbitrary graphs, including Metatron's Cube."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["fuzz"]
documentation = "https://docs.rs/metatron-qso-rs"
keywords = ["quantum", "simulator", "qaoa", "vqe", "quantum-walk"]
categories = ["science", "simulation", "mathematics"]

[lib]
name = "metatron_qso"

[[bin]]
name = "qso"
path = "src/bin/qso.rs"
required-features = ["cli"]

[features]
default = ["parallel"]
## Multi-threaded kernels via rayon.
parallel = ["dep:rayon"]
## The `qso` command-line tool.
cli = ["dep:clap"]

[dependencies]
nalgebra.workspace = true
num-complex.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }

# Benchmarks and property tests run natively; the library's unit tests
# also run as wasm32-wasip1 (see scripts/wasi-runner.mjs).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "simulator"
harness = false
