[book]
title = "QSO User Guide"
authors = ["Sebastian Klemm"]
language = "en"
src = "src"

[build]
build-dir = "book"
# The tutorial pages are generated by docs/build_site.py, from the notebooks
# in docs/tutorials and from docs/guide/rust with the crate's examples; a
# missing page is an error, not an empty chapter.
create-missing = false

[output.html]
git-repository-url = "https://github.com/LashSesh/qso"
edit-url-template = "https://github.com/LashSesh/qso/edit/main/docs/guide/{path}"
mathjax-support = true
