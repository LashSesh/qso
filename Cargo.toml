[workspace]
members = ["metatron-qso-rs", "metatron_qso_py"]
exclude = ["metatron-qso-rs/fuzz"]
resolver = "3"

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.89"
authors = ["Sebastian Klemm"]
license = "Apache-2.0"
repository = "https://github.com/LashSesh/qso"

[workspace.dependencies]
metatron-qso-rs = { path = "metatron-qso-rs", version = "1.5.0", default-features = false }
nalgebra = "0.35"
num-complex = { version = "0.4", features = ["serde"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
pyo3 = "0.30"
numpy = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.test]
opt-level = 2
