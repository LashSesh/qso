name: Docs

# Builds the documentation site: the user guide (mdBook, docs/guide), the
# tutorials (docs/tutorials, executed during the build), the Python API
# reference (pdoc) and the playground (docs/playground), which runs QSO
# compiled to WebAssembly. Every code block of the guide is run as part of the
# build. Pull requests build the site; pushes to main also deploy it to
# GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The playground's WebAssembly module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Install QSO from this commit and the documentation tools
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -r docs/requirements.txt
          maturin build --release -m metatron_qso_py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      - name: Build the site
        run: python docs/build_site.py --out site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
