name: Docs

# Builds the documentation site: the user guide (mdBook, docs/guide), the
# tutorials (docs/tutorials, executed during the build, and the Rust
# tutorials, whose examples are compiled and run), the Python API
# reference (pdoc), the playground (docs/playground), which runs QSO
# compiled to WebAssembly, the guide and Python reference of every release
# (/<version>/, built from its tag and cached), and the line and branch
# coverage report of the crate's tests (/coverage/). Every code block of the
# guide is run as part of the build. Pull requests build the site; pushes to main also deploy it to
# GitHub Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, for the documentation of every release.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The playground's WebAssembly module.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Install QSO from this commit and the documentation tools
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -r docs/requirements.txt
          maturin build --release -m metatron_qso_py/Cargo.toml -o dist
          python -m pip install dist/*.whl
      # Releases do not change: each is built once per version of the build
      # script and kept.
      - name: Release tags
        id: tags
        run: echo "hash=$(git tag --list 'v*' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: docs-releases
          key: docs-releases-${{ hashFiles('docs/build_site.py') }}-${{ steps.tags.outputs.hash }}
          restore-keys: docs-releases-${{ hashFiles('docs/build_site.py') }}-
      - name: Build the site
        run: python docs/build_site.py --out site --versions docs-releases
      # The coverage report is published from main only (pull requests
      # get it from the CI coverage job).
      - uses: dtolnay/rust-toolchain@nightly
        if: github.event_name != 'pull_request'
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        if: github.event_name != 'pull_request'
        with:
          tool: cargo-llvm-cov
      # The coverage report of this commit, published with the
      # documentation at /coverage/.
      - name: Coverage report
        if: github.event_name != 'pull_request'
        env:
          RUSTFLAGS: ""
        run: |
          cargo +nightly llvm-cov --release -p metatron-qso-rs --all-features --branch --html --output-dir site/coverage
          cargo +nightly llvm-cov report --release -p metatron-qso-rs --branch --json --summary-only --output-path site/coverage/summary.json
          python3 scripts/coverage_summary.py site/coverage/summary.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
