name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps -p metatron-qso-rs --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, validation and doc tests
        run: cargo test -p metatron-qso-rs --all-features
      - name: Serial build (no rayon)
        run: cargo test -p metatron-qso-rs --no-default-features --lib

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p metatron-qso-rs --all-features --all-targets

  examples:
    name: examples + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p metatron-qso-rs --features cli --examples --bins
      - run: |
          for ex in quickstart metatron_walks circuits qaoa_maxcut vqe_h2; do
            cargo run --release -p metatron-qso-rs --example "$ex"
          done
          cargo run --release -p metatron-qso-rs --example technical_note -- --quick --out /dev/null
      - run: |
          ./target/release/qso graph metatron
          ./target/release/qso search --graph metatron --marked 3
          ./target/release/qso qaoa --graph petersen --p 2
          ./target/release/qso vqe --model h2 --json
      - name: Benchmarks compile
        run: cargo bench -p metatron-qso-rs --no-run

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip maturin numpy pytest
      - run: maturin build --release -m metatron_qso_py/Cargo.toml -o dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest metatron_qso_py/tests -q
      - name: Type stubs match the compiled module
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy==2.4.0
          python -m mypy.stubtest metatron_qso._core --ignore-disjoint-bases \
            --allowlist metatron_qso_py/stubtest-allowlist.txt
          python -m mypy metatron_qso_py/examples metatron_qso_py/tests

  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Against the latest release on crates.io. 1.x releases may add, never
      # break, so every change is checked as a minor release.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: metatron-qso-rs
          release-type: minor

  miri:
    name: Miri (unsafe kernels)
    runs-on: ubuntu-latest
    env:
      # Nightly lints are not the subject of this job.
      RUSTFLAGS: ""
      # Tree Borrows: rayon's dependency crossbeam-epoch violates the stricter
      # Stacked Borrows model (a known false positive outside this crate).
      # Ignore leaks: rayon's global worker threads outlive the test harness.
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # Under Miri the parallel thresholds are lowered (src/parallel.rs), so
      # the multi-threaded kernel paths run on 7-qubit registers.
      - run: "cargo miri test -p metatron-qso-rs --lib -- quantum::kernels:: parallel::"

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: metatron-qso-rs/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the parsers and deserialisers
        working-directory: metatron-qso-rs
        run: |
          for t in qasm pauli graph_spec graph_io json; do
            mkdir -p "fuzz/corpus/$t"
            # The prebuilt cargo-fuzz is a static musl binary and would
            # default to the musl target, which the sanitizer cannot use.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- \
              -max_total_time=60 -rss_limit_mb=2048 -timeout=30
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: metatron-qso-rs/fuzz/artifacts
