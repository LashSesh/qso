name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps -p metatron-qso-rs --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, validation and doc tests
        run: cargo test -p metatron-qso-rs --all-features
      - name: Serial build (no rayon)
        run: cargo test -p metatron-qso-rs --no-default-features --lib

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p metatron-qso-rs --all-features --all-targets

  examples:
    name: examples + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p metatron-qso-rs --features cli --examples --bins
      - run: |
          for ex in quickstart metatron_walks metatron_atlas circuits qaoa_maxcut vqe_h2 noise_mitigation molecules stabilizers surface_code mps; do
            cargo run --release -p metatron-qso-rs --example "$ex"
          done
          cargo run --release -p metatron-qso-rs --example technical_note -- --quick --out /dev/null
      - run: |
          ./target/release/qso graph metatron
          ./target/release/qso search --graph metatron --marked 3
          ./target/release/qso qaoa --graph petersen --p 2
          ./target/release/qso vqe --model h2 --json
          ./target/release/qso graph johnson:5,2 --save /tmp/j52.graphml
          ./target/release/qso iso /tmp/j52.graphml johnson:5,2
          ./target/release/qso reduce --graph hypercube:12
          ./target/release/qso transfer --graph path:3
          ./target/release/qso transfer --graph path:5 --t-max 200
          ./target/release/qso coined --graph hypercube:8
          ./target/release/qso hitting --graph cycle:64
          ./target/release/qso walk-circuit --graph cycle:16 > /tmp/walk.qasm
          ./target/release/qso qasm /tmp/walk.qasm --shots 100
          ./target/release/qso qasm /tmp/walk.qasm --shots 100 --mps --max-bond 64
          ./target/release/qso qasm /tmp/walk.qasm --shots 100 --single
          ./target/release/qso qasm metatron-qso-rs/tests/data/openqasm/v3/teleport.qasm --shots 100
          ./target/release/qso qasm metatron-qso-rs/tests/data/openqasm/v2/qec.qasm --export qasm3
          ./target/release/qso qasm metatron-qso-rs/tests/data/openqasm/v2/qec.qasm --stabilizer --shots 100
          ./target/release/qso qec --distance 3,5 --p 0.001 --shots 2000 --stim /tmp/surface.stim
          ./target/release/qso qec --distance 3,5 --p 0.005 --shots 2000 --decoder matching
          ./target/release/qso qec --circuit /tmp/surface.stim --shots 2000 --decoder matching
          ./target/release/qso qec --code color --distance 3,5 --p 0.002 --shots 2000 --decoder bposd
          ./target/release/qso qec --code bb --distance 72 --p 0.001 --shots 200 --decoder bposd
          ./target/release/qso qasm /tmp/walk.qasm --shots 100 --device metatron-qso-rs/examples/devices/toy_device.json --trajectories 50
          ./target/release/qso estimate /tmp/walk.qasm --observable "Z0 Z1" --device metatron-qso-rs/examples/devices/toy_device.json --shots 4000 --mitigate-readout --zne 1,3
          ./target/release/qso molecule metatron-qso-rs/examples/molecules/lih_sto3g.fcidump --mapping parity --two-qubit-reduction --method adapt
          ./target/release/qso scf --atoms "Li 0 0 0; H 0 0 1.595" --basis 6-31g --frozen 1 --active 5 --fci --fcidump /tmp/lih.fcidump
          ./target/release/qso molecule /tmp/lih.fcidump --method none
          ./target/release/qso trotter --hamiltonian "Z0 Z1 + 0.5 X0 + 0.5 X1" --steps 20 --order 4 --output /tmp/trotter.qasm
          ./target/release/qso qasm /tmp/trotter.qasm --shots 100
      - name: Benchmarks compile
        run: cargo bench -p metatron-qso-rs --no-run

  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip maturin numpy pytest
      - run: maturin build --release -m metatron_qso_py/Cargo.toml -o dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest metatron_qso_py/tests -q
      - name: Type stubs match the compiled module
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy==2.4.0
          python -m mypy.stubtest metatron_qso._core --ignore-disjoint-bases \
            --allowlist metatron_qso_py/stubtest-allowlist.txt
          python -m mypy metatron_qso_py/examples metatron_qso_py/tests

  wasm:
    name: WebAssembly (core tests under WASI, npm package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The library's unit, validation, OpenQASM and robustness tests, built
      # for wasm32 and run under Node's WASI: the same test vectors as the
      # native build (property tests and benchmarks need native threads).
      - name: Core tests as wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node --no-warnings ${{ github.workspace }}/scripts/wasi-runner.mjs
        run: >-
          cargo test --release --target wasm32-wasip1 -p metatron-qso-rs --no-default-features
          --lib --test validation --test openqasm --test robustness
      - name: JSON interface (native)
        run: cargo test -p metatron_qso_wasm
      - name: npm package
        run: |
          python3 scripts/build_wasm.py
          cd metatron_qso_wasm/js
          npm test
          npm pack --dry-run

  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Against the latest release on crates.io. 1.x releases may add, never
      # break, so every change is checked as a minor release.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: metatron-qso-rs
          release-type: minor

  miri:
    name: Miri (unsafe kernels and exports)
    runs-on: ubuntu-latest
    env:
      # Nightly lints are not the subject of this job.
      RUSTFLAGS: ""
      # Tree Borrows: rayon's dependency crossbeam-epoch violates the stricter
      # Stacked Borrows model (a known false positive outside this crate).
      # Ignore leaks: rayon's global worker threads outlive the test harness.
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # Under Miri the parallel thresholds are lowered (src/parallel.rs), so
      # the multi-threaded kernel paths run on 7-qubit registers.
      - run: "cargo miri test -p metatron-qso-rs --lib -- quantum::kernels:: quantum::plan:: quantum::single::tests::vector_primitives parallel:: algorithms::gradients::tests::the_blocked"
      # The WebAssembly module's exports pass buffers as raw pointers.
      - run: cargo miri test -p metatron_qso_wasm --lib -- buffers_round_trip

  coverage:
    name: coverage (lines and branches)
    runs-on: ubuntu-latest
    env:
      # Nightly may warn where stable does not.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # Branch coverage needs nightly's -Z coverage-options.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Unit, validation, property and differential tests with coverage
        run: |
          cargo llvm-cov --release -p metatron-qso-rs --all-features --branch --json --summary-only --output-path coverage.json
          cargo llvm-cov report --release -p metatron-qso-rs --branch --summary-only | tee coverage.txt
          python3 scripts/coverage_summary.py coverage.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.json
            coverage.txt

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: metatron-qso-rs/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the parsers, the deserialisers and the simulators against each other
        working-directory: metatron-qso-rs
        run: |
          for t in qasm openqasm pauli graph_spec graph_io json device chemistry qec stim differential; do
            mkdir -p "fuzz/corpus/$t"
            # The prebuilt cargo-fuzz is a static musl binary and would
            # default to the musl target, which the sanitizer cannot use.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" "fuzz/corpus/$t" "fuzz/seeds/$t" -- \
              -max_total_time=60 -rss_limit_mb=2048 -timeout=30
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: metatron-qso-rs/fuzz/artifacts
