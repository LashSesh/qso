name: Release

# Pushing a tag `vX.Y.Z` publishes version X.Y.Z:
#
#   1. preflight  – tag, Cargo, pyproject and npm versions agree, the
#                   CHANGELOG has an entry, and the crate packages and builds
#                   on its own (`cargo publish --dry-run`);
#   2. wheels     – abi3 wheels for Linux (manylinux and musllinux, x86_64 and
#                   aarch64), macOS (universal2) and Windows (x86_64, arm64),
#                   each built on its own architecture, installed and tested
#                   with the Python test-suite;
#      sdist      – source distribution, built and tested the same way;
#      npm-package – the WebAssembly module and its JavaScript package,
#                   tested with Node and packed;
#   3. crates.io  – `metatron-qso-rs`;
#   4. PyPI       – `metatron-qso` (wheels + sdist, with attestations);
#      npm        – `metatron-qso` (with provenance);
#   5. GitHub     – release with notes from CHANGELOG.md and all artefacts.
#
# Publishing steps skip versions that are already on the registry, so a
# failed run can be re-run. Started manually (workflow_dispatch), the
# workflow runs steps 1–2 only and publishes nothing; use this as a dry run.
#
# Publishing uses Trusted Publishing (OpenID Connect): no registry tokens are
# stored. The publishing jobs run in the GitHub environment `release`, and
# both registries trust exactly this workflow in that environment:
#
#   PyPI       – project `metatron-qso` → Settings → Publishing → GitHub:
#                owner LashSesh, repository qso, workflow release.yml,
#                environment release
#   crates.io  – crate `metatron-qso-rs` → Settings → Trusted Publishing →
#                GitHub: owner LashSesh, repository qso, workflow
#                release.yml, environment release
#   npm        – package `metatron-qso` → Settings → Trusted Publisher →
#                GitHub Actions: owner LashSesh, repository qso, workflow
#                release.yml, environment release. npm attaches a trusted
#                publisher only to an existing package: publish the first
#                version once by hand (`npm publish` in metatron_qso_wasm/js
#                after `python scripts/build_wasm.py`); until then the npm
#                job fails and the rest of the release goes ahead.
#   GitHub     – Settings → Environments → `release`: required reviewer
#                (the maintainer) and deployment tags `v*`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions agree
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, tomllib

          cargo = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          py = tomllib.load(open("metatron_qso_py/pyproject.toml", "rb"))["project"]["version"]
          npm = json.load(open("metatron_qso_wasm/js/package.json"))["version"]
          errors = []
          if cargo != py:
              errors.append(f"Cargo.toml has {cargo}, pyproject.toml has {py}")
          if cargo != npm:
              errors.append(f"Cargo.toml has {cargo}, package.json has {npm}")
          if not re.search(rf"^## \[{re.escape(cargo)}\]", open("CHANGELOG.md").read(), re.M):
              errors.append(f"CHANGELOG.md has no '## [{cargo}]' section")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{cargo}":
              errors.append(f"tag {os.environ['GITHUB_REF_NAME']} does not match version {cargo}")
          for e in errors:
              print(f"::error::{e}")
          print(f"version {cargo}")
          sys.exit(1 if errors else 0)
          EOF
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Crate packages and builds on its own
        run: cargo publish -p metatron-qso-rs --dry-run --locked

  wheels:
    name: wheel (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64, linux: auto }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, linux: auto }
          - { platform: musllinux-x86_64, os: ubuntu-latest, target: x86_64, linux: musllinux_1_2 }
          - { platform: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, linux: musllinux_1_2 }
          - { platform: macos-universal2, os: macos-latest, target: universal2-apple-darwin }
          - { platform: windows-x86_64, os: windows-latest, target: x64 }
          - { platform: windows-arm64, os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked -m metatron_qso_py/Cargo.toml -o dist
          manylinux: ${{ matrix.linux || 'auto' }}
      - name: Test the wheel (musl, in Alpine Linux)
        if: matrix.linux == 'musllinux_1_2'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.12-alpine sh -c \
            "pip install -q pytest dist/*.whl && python -m pytest metatron_qso_py/tests -q"
      - name: Test the wheel
        if: matrix.linux != 'musllinux_1_2'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
          python -m pytest metatron_qso_py/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

  sdist:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m metatron_qso_py/Cargo.toml -o dist
      - name: Build from the source distribution and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest twine
          python -m twine check --strict dist/*.tar.gz
          # PyPI rejects an sdist whose metadata names a license file that
          # the archive does not contain; twine does not check this.
          python - dist/*.tar.gz <<'EOF'
          import sys, tarfile

          for path in sys.argv[1:]:
              with tarfile.open(path) as tar:
                  root = tar.getnames()[0].split("/")[0]
                  names = set(tar.getnames())
                  meta = tar.extractfile(f"{root}/PKG-INFO").read().decode()
              declared = [line.split(":", 1)[1].strip() for line in meta.splitlines()
                          if line.startswith("License-File:")]
              missing = [f for f in declared if f"{root}/{f}" not in names]
              print(f"{path}: License-File {declared}")
              if missing:
                  sys.exit(f"{path}: declared license files missing from the archive: {missing}")
          EOF
          python -m pip install dist/*.tar.gz
          python -m pytest metatron_qso_py/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  npm-package:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build, test and pack
        run: |
          python3 scripts/build_wasm.py
          cd metatron_qso_wasm/js
          npm test
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: metatron_qso_wasm/js/*.tgz

  crates-io:
    needs: [wheels, sdist, npm-package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/metatron-qso-rs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Exchanges the workflow's OIDC token for a short-lived crates.io token.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish metatron-qso-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS -o /dev/null -A "LashSesh/qso release workflow" \
              "https://crates.io/api/v1/crates/metatron-qso-rs/$version"; then
            echo "metatron-qso-rs $version is already on crates.io"
          else
            cargo publish -p metatron-qso-rs --locked
          fi

  pypi:
    needs: crates-io
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/metatron-qso/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The npm tarball is not a Python distribution.
      - run: rm -f dist/*.tgz && ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    needs: crates-io
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/metatron-qso
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          # npm 11 (bundled with Node 24) publishes with OIDC trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm
      - name: Publish metatron-qso
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "metatron-qso@$version" version >/dev/null 2>&1; then
            echo "metatron-qso $version is already on npm"
          else
            # "./": without it npm reads "npm/…" as a GitHub repository.
            npm publish ./npm/metatron-qso-"$version".tgz --access public --provenance
          fi

  github-release:
    needs: [pypi, npm]
    # A failed npm publish (see the note above) does not hold back the release.
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "\`pip install metatron-qso==$version\` · \`cargo add metatron-qso-rs@$version\` · \`npm install metatron-qso@$version\`"
            echo
            # The section of this version, without its heading; repository
            # links made absolute so that they work on the release page.
            awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md \
              | sed -E "s#\]\(((docs|metatron-qso-rs|metatron_qso_py)/[^)]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: QSO ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          make_latest: true
