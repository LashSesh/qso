[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "metatron-qso"
version = "1.1.0"
description = "Validated quantum simulation in pure Rust: circuits, VQE/QAOA with exact gradients, noise, and quantum walks on graphs including Metatron's Cube."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Klemm" }]
keywords = ["quantum", "simulator", "qaoa", "vqe", "quantum-walk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/LashSesh/qso"
Documentation = "https://github.com/LashSesh/qso/blob/main/metatron_qso_py/README.md"
Changelog = "https://github.com/LashSesh/qso/blob/main/CHANGELOG.md"
Issues = "https://github.com/LashSesh/qso/issues"

[tool.maturin]
python-source = "python"
module-name = "metatron_qso._core"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
