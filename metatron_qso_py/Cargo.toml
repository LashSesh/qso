[package]
name = "metatron_qso_py"
description = "Python bindings for QSO 2.0 (metatron-qso-rs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
metatron-qso-rs = { workspace = true, features = ["parallel"] }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py39", "num-complex"] }
numpy.workspace = true
num-complex.workspace = true
